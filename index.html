<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vividus — Share Your Experience</title>
<meta name="description" content="Share your honest experience at Vividus on Google.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ===== CONFIG: brand colours (sampled from the Vividus logo) ===== */
  :root{
    --green:#84B242;      /* logo green */
    --green-d:#4C8424;    /* deeper green for buttons/text (readable on white) */
    --green-t:#F1F7E8;    /* green tint backgrounds */
    --blue:#3D66A8;       /* logo blue */
    --blue-d:#284A80;
    --blue-t:#EDF2FA;
    --grey:#787878;       /* logo grey */
    --red:#E1262B;        /* logo cross — accent only */
    --ink:#1E2B3A; --muted:#66707C; --line:#E4E8EC; --bg:#F6F8F5; --white:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Plus Jakarta Sans","Noto Sans SC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto;min-height:100vh;background:var(--white);display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}
  header{padding:18px 20px 0;background:var(--white)}
  .brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand img{height:46px;width:auto;display:block}
  .langs{display:flex;background:#F1F3F2;border-radius:999px;padding:3px}
  .langs button{border:0;background:transparent;color:var(--grey);font:inherit;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;cursor:pointer}
  .langs button.on{background:var(--white);color:var(--green-d);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .hero{margin-top:18px;border-radius:20px;padding:22px 20px 20px;color:var(--white);position:relative;overflow:hidden;
        background:linear-gradient(125deg,#8DC447 0%,#4FAE52 50%,#2E9C8F 78%,#3D78BE 100%)}
  .hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.10)}
  .hero::before{content:"";position:absolute;right:30px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.07)}
  .hero h1{font-size:24px;font-weight:800;line-height:1.25;position:relative;z-index:1}
  .hero p{font-size:14px;opacity:.95;margin-top:6px;position:relative;z-index:1;max-width:34ch}
  .steps{display:flex;align-items:center;gap:8px;margin:18px 0 0;padding:0 2px}
  .dot{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#A3AAB2}
  .dot i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;background:#EEF0F2;color:#9AA1A9;transition:all .2s}
  .dot.on{color:var(--ink)} .dot.on i{background:var(--green);color:var(--white)}
  .dot.done i{background:var(--green-t);color:var(--green-d)}
  .sep{flex:1;height:2px;background:#EEF0F2;border-radius:2px;overflow:hidden}
  .sep span{display:block;height:100%;width:0;background:var(--green);transition:width .3s}
  .sep.done span{width:100%}
  main{padding:22px 20px 28px;flex:1}
  .step{display:none;animation:in .25s ease}
  .step.on{display:block}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h2{font-size:19px;font-weight:800;margin-bottom:4px;color:var(--ink)}
  .hint{font-size:13px;color:var(--muted);margin-bottom:16px}
  .modes{display:grid;gap:10px}
  .mode{display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);border-radius:16px;padding:15px 16px;background:var(--white);cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .15s,box-shadow .15s,transform .1s}
  .mode:hover{border-color:var(--green);box-shadow:0 6px 18px rgba(76,132,36,.12)}
  .mode:active{transform:scale(.99)}
  .mode .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}
  .mode .ic svg{width:24px;height:24px}
  .ic.g{background:var(--green-t);color:var(--green-d)}
  .ic.b{background:var(--blue-t);color:var(--blue)}
  .mode b{display:block;font-size:15px}
  .mode small{color:var(--muted);font-size:12.5px}
  .mode .arr{margin-left:auto;color:#B8BEC5;font-size:18px}
  .group{margin-bottom:22px}
  .label{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .label em{font-style:normal;font-weight:500;color:var(--muted);font-size:12px;white-space:nowrap}
  .rate{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  .rate button{border:1.5px solid var(--line);background:var(--white);border-radius:12px;padding:10px 2px 8px;font:inherit;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .12s}
  .rate button b{font-size:18px;font-weight:800;color:var(--muted)}
  .rate button span{font-size:10.5px;overflow-wrap:anywhere;line-height:1.2;color:var(--muted);text-align:center}
  .rate button.on{background:var(--blue-t);border-color:var(--blue)}
  .rate button.on b,.rate button.on span{color:var(--blue-d);font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--line);background:var(--white);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink);transition:all .12s}
  .chip:hover{border-color:#C9D9B5}
  .chip.on{background:var(--green-t);border-color:var(--green);color:var(--green-d);font-weight:700}
  .chip.on::before{content:"✓ "}
  .chips.blue .chip.on{background:var(--blue-t);border-color:var(--blue);color:var(--blue-d)}
  input[type=text],textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;color:var(--ink);background:var(--white);outline:none;resize:vertical;transition:border-color .15s,box-shadow .15s}
  input[type=text]:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(132,178,66,.18)}
  textarea{min-height:96px}
  #draft{min-height:190px;background:#FBFDF8;border-color:#D6E6C2}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px 18px;font:inherit;font-size:15px;font-weight:800;cursor:pointer;text-decoration:none;transition:transform .08s,box-shadow .15s}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:linear-gradient(135deg,#6FA83A,var(--green-d));color:var(--white);box-shadow:0 8px 20px rgba(76,132,36,.25)}
  .btn-dark{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:var(--white);box-shadow:0 8px 20px rgba(40,74,128,.25)}
  .btn-ghost{background:var(--white);color:var(--ink);border:1.5px solid var(--line);font-weight:700}
  .btn-ghost:hover{border-color:var(--green)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .stack{display:grid;gap:10px;margin-top:16px}
  .back{background:none;border:0;font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:14px;padding:0}
  .note{font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:12px;padding:11px 13px;margin-top:12px;display:flex;gap:9px}
  .note::before{content:"i";flex-shrink:0;width:18px;height:18px;border-radius:50%;background:var(--blue-t);color:var(--blue);font-weight:800;font-size:11px;display:grid;place-items:center;font-style:italic}
  .warn{font-size:12.5px;color:#9A1B1F;background:#FDECEC;border-radius:10px;padding:10px 12px;margin-top:10px;display:none}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--white);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .count{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
  footer{font-size:11.5px;color:var(--grey);text-align:center;padding:16px 20px 24px;border-top:1px solid var(--line)}
  footer b{color:var(--red)}
</style>
</head>

let lang = "en", mode = null, step = 0;
const pickedS = new Set(), pickedH = new Set(), pickedR = new Set();
let rating = 0;
const $ = s => document.querySelector(s);
const pick = a => a[Math.floor(Math.random()*a.length)];

function joinList(arr){
  const t = T[lang];
  if (lang === "zh") return arr.length<2 ? arr.join("") : arr.slice(0,-1).join("、")+t.and+arr[arr.length-1];
  if (arr.length<2) return arr.join("");
  return arr.slice(0,-1).join(", ")+t.and+arr[arr.length-1];
}
function cap(s){ return lang==="zh" ? s : s.charAt(0).toUpperCase()+s.slice(1); }

function renderChips(){
  const make = (el, list, set) => {
    el.innerHTML = "";
    list[lang].forEach((label,i)=>{
      const b = document.createElement("button");
      b.className = "chip"+(set.has(i)?" on":"");
      b.textContent = label;
      b.onclick = ()=>{ set.has(i)?set.delete(i):set.add(i); b.classList.toggle("on"); $("#needMore").style.display="none"; };
      el.appendChild(b);
    });
  };
  make($("#chipsService"), SERVICES, pickedS);
  make($("#chipsHighlight"), HIGHLIGHTS, pickedH);
  make($("#chipsReco"), RECO, pickedR);
  const r = $("#rate"); r.innerHTML = "";
  T[lang].rateL.forEach((lab,i)=>{
    const b = document.createElement("button");
    b.className = rating===i+1 ? "on" : "";
    b.innerHTML = "<b>"+(i+1)+"</b><span>"+lab+"</span>";
    b.onclick = ()=>{ rating=i+1; $("#needMore").style.display="none"; renderChips(); updateReco(); };
    r.appendChild(b);
  });
}
function updateReco(){
  const show = rating===0 || rating>=3;
  $("#recoGroup").style.display = show ? "" : "none";
  if (!show) pickedR.clear();
}

function applyLang(){
  document.documentElement.lang = lang==="zh"?"zh-Hans":lang;
  document.querySelectorAll("[data-t]").forEach(el=>{ const v=T[lang][el.dataset.t]; if(typeof v==="string") el.textContent=v; });
  document.querySelectorAll("[data-ph]").forEach(el=>{ el.placeholder=T[lang][el.dataset.ph]; });
  document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on", b.dataset.lang===lang));
  renderChips();
  updateCount();
  try{ localStorage.setItem("vv_lang",lang); }catch(e){}
}

function go(n){
  step = n;
  document.querySelectorAll(".step").forEach((s,i)=>s.classList.toggle("on", i===n));
  document.querySelectorAll("#steps .dot").forEach((d,i)=>{ d.classList.toggle("on", i===n); d.classList.toggle("done", i<n); });
  document.querySelectorAll("#steps .sep").forEach((s,i)=>s.classList.toggle("done", i<n));
  window.scrollTo({top:0,behavior:"smooth"});
}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
let lastDraft = "";
function composeDraft(){
  const t = T[lang], sep = lang==="zh" ? "" : " ";
  const head = [pick(t.open[mode])];
  if (rating) head.push(pick(t.rateS[rating-1]));
  const mid = [];
  const sv = shuffle([...pickedS].map(i=>SERVICES[lang][i]));
  if (sv.length) mid.push(pick(t.svc).replace("{x}", joinList(sv)));
  const h = shuffle([...pickedH].map(i=>HIGHLIGHTS[lang][i]));
  if (h.length) mid.push(cap(pick(t.hl).replace("{x}", joinList(h))));
  const body = shuffle(mid);
  const own = $("#own").value.trim();
  if (own) body.splice(Math.floor(Math.random()*(body.length+1)), 0, own);
  const tail = [];
  const r = shuffle([...pickedR].map(i=>RECO[lang][i]));
  if (r.length) tail.push(cap(pick(t.reco).replace("{x}", joinList(r))));
  const staff = $("#staff").value.trim();
  if (staff) tail.push(pick(mode==="family" ? t.st.us : t.st.me).replace("{x}", staff));
  return head.concat(body, shuffle(tail)).join(sep);
}
function buildDraft(){
  let d = composeDraft(), tries = 0;
  while (d === lastDraft && tries++ < 20) d = composeDraft();
  lastDraft = d; return d;
}

function updateCount(){ const n=$("#draft").value.length; $("#count").textContent = n ? n+" "+T[lang].chars : ""; }

function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),1800); }

async function copyDraft(){
  const txt = $("#draft").value;
  try{ await navigator.clipboard.writeText(txt); toast(T[lang].copied); return true; }
  catch(e){
    try{ const d=$("#draft"); d.focus(); d.select(); const ok=document.execCommand("copy"); if(ok){toast(T[lang].copied);return true;} }catch(_){}
    toast(T[lang].copyFail); return false;
  }
}

/* events */
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>{
  const wasDraft = step===2; lang=b.dataset.lang; applyLang();
  if (wasDraft){ $("#draft").value = buildDraft(); updateCount(); }
});
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{ mode=b.dataset.mode; go(1); });
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
$("#build").onclick=()=>{
  const nm = $("#needMore");
  if (!rating){ nm.textContent = T[lang].needRating; nm.style.display="block"; return; }
  if (!pickedS.size && !pickedH.size && !$("#own").value.trim()){ nm.textContent = T[lang].needMore; nm.style.display="block"; return; }
  $("#draft").value = buildDraft(); updateCount(); go(2);
};
$("#reshuffle").onclick=()=>{ $("#draft").value = buildDraft(); updateCount(); };
$("#copy").onclick=copyDraft;
$("#draft").addEventListener("input", updateCount);
const reviewUrl = CONFIG.GOOGLE_REVIEW_URL || CONFIG.FALLBACK_URL;
$("#post").href = reviewUrl;
$("#post").addEventListener("click", ()=>{ copyDraft(); }); // link opens normally; copy runs in the same tap

/* init */
try{ const saved=localStorage.getItem("vv_lang"); if(saved && T[saved]) lang=saved; }catch(e){}
applyLang(); go(0);
</script>
